name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node build.js
      - name: the committed bundle matches src/app
        run: git diff --exit-code -- public/app.js public/index.html
      - run: node --test test/*.test.js
