name: tests
on:
  push:
    branches: [main]
  pull_request:
# A new push cancels the run it supersedes, so a quick fix-up does not cost two runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: node build.js
      # Everything build.js writes, not only the bundle: the worker's cache name and the
      # Guide the coach reads are generated too, and could drift just as quietly.
      - name: the committed build output matches its sources
        run: git diff --exit-code -- public/app.js public/index.html public/sw.js src/guide-text.js
      # The same gate as `npm test`, which lints before it runs the suite.
      - run: npx eslint .
      - run: node --no-warnings=ExperimentalWarning --test test/*.test.js

  # Optional. The primary deploy is `npm run deploy` from a laptop (tests, migrations,
  # then wrangler). This job does the same from a push to main, but only when a
  # CLOUDFLARE_API_TOKEN secret is set; without one it skips rather than fails, so the
  # workflow costs nothing extra until someone decides to turn it on.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: token
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "has=true" >> "$GITHUB_OUTPUT"
          else echo "has=false" >> "$GITHUB_OUTPUT"; echo "No CLOUDFLARE_API_TOKEN secret: deploy skipped. Use npm run deploy."; fi
      - if: steps.token.outputs.has == 'true'
        uses: actions/checkout@v4
      - if: steps.token.outputs.has == 'true'
        uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - if: steps.token.outputs.has == 'true'
        run: npm ci
      - if: steps.token.outputs.has == 'true'
        name: apply D1 migrations
        run: npx wrangler d1 migrations apply operator-black --remote
      - if: steps.token.outputs.has == 'true'
        name: deploy the Worker
        run: npx wrangler deploy --tag "v$(node -p "require('./package.json').version")-$(git rev-parse --short HEAD)"
