<style>
/* Layout: phone-first gym log. Sticky header with tabs, one column of session cards (max 760px).
   Intensity uses bumper-plate colors: green = light, yellow = medium, red = heavy. */
:root{
  --bg:#e8ebe6; --surface:#f7f8f5; --sunk:#dde2db; --ink:#131916; --muted:#56625b; --line:#cad1c8;
  --accent:#1b45c2; --accent-ink:#ffffff; --accent-bg:#dbe3f8;
  --red:#b92f27; --red-bg:#f4dbd8; --yellow:#8f6a00; --yellow-bg:#f2e6bb; --green:#276f3d; --green-bg:#d6eadb;
  --f-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1311; --surface:#181e1b; --sunk:#222a26; --ink:#e5ebe7; --muted:#96a39c; --line:#2c3531;
  --accent:#7d9cff; --accent-ink:#0b1022; --accent-bg:#1e2947;
  --red:#ff7a6e; --red-bg:#3a1f1c; --yellow:#efc350; --yellow-bg:#352c12; --green:#6fd08e; --green-bg:#17301f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1311; --surface:#181e1b; --sunk:#222a26; --ink:#e5ebe7; --muted:#96a39c; --line:#2c3531;
  --accent:#7d9cff; --accent-ink:#0b1022; --accent-bg:#1e2947;
  --red:#ff7a6e; --red-bg:#3a1f1c; --yellow:#efc350; --yellow-bg:#352c12; --green:#6fd08e; --green-bg:#17301f;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{white-space:nowrap;flex-shrink:0;margin:0;font-family:var(--f-display);font-stretch:125%;font-weight:900;font-size:19px;letter-spacing:.02em;text-transform:uppercase}
.brand h1 span{color:var(--accent)}
#status{font-size:12px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-align:right}
#status.link{text-decoration:underline;cursor:pointer}
#status.err{color:var(--red)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{all:unset;cursor:pointer;padding:8px 12px 10px;font-weight:650;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main{display:flex;flex-direction:column;gap:14px;padding-top:16px}
h2{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:20px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;font-weight:650;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn:focus-visible,.setb:focus-visible,.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.light{background:var(--green-bg);color:var(--green)}
.chip.mid{background:var(--yellow-bg);color:var(--yellow)}
.chip.heavy{background:var(--red-bg);color:var(--red)}
.chip.blue{background:var(--accent-bg);color:var(--accent)}
.banner{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--sunk)}
.banner.warn{background:var(--yellow-bg);border-color:transparent}
.banner.alert{background:var(--red-bg);border-color:transparent}
.banner.info{background:var(--accent-bg);border-color:transparent}
.banner b{font-weight:750}

/* date nav + week strip */
.dnav{display:flex;align-items:center;gap:8px}
.dnav h2{flex:1;min-width:0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{all:unset;cursor:pointer;border-radius:8px;padding:6px 2px 7px;text-align:center;display:flex;flex-direction:column;gap:1px;border:1px solid transparent;min-width:0}
.day .dn{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day .dd{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:20px;line-height:1.1}
.day .dl{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .dot{width:6px;height:6px;border-radius:50%;margin:2px auto 0;background:transparent}
.day .dot.on{background:var(--green)}
.day.sel{background:var(--surface);border-color:var(--line)}
.day.today .dd{color:var(--accent)}
.wkline{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}

/* lift card */
.lift-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.lift-name{font-family:var(--f-display);font-stretch:118%;font-weight:850;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.rx{font-family:var(--f-mono);font-weight:600;font-size:14px}
.big{font-family:var(--f-display);font-stretch:68%;font-weight:850;font-size:52px;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big small{font-size:18px;font-weight:700;color:var(--muted);font-stretch:100%;margin-left:4px}
.plates{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.ramp{display:flex;flex-wrap:wrap;gap:4px 6px;font-family:var(--f-mono);font-size:13px}
.ramp span{background:var(--sunk);border-radius:6px;padding:2px 7px}
/* rest timer */
#rest{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgb(0 0 0 / .12);padding-bottom:env(safe-area-inset-bottom,0px)}
.rest-in{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"txt time" "btns btns";gap:8px 12px;align-items:center}
.rest-txt{grid-area:txt;display:flex;flex-direction:column;min-width:0}
#rest-lbl{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
#rest-next{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest-time{grid-area:time;font-family:var(--f-display);font-stretch:68%;font-weight:850;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.rest-btns{grid-area:btns;display:flex;gap:8px}
.rest-btns .btn{flex:1}
.rest-bar{height:4px;background:var(--sunk)}
.rest-bar i{display:block;height:100%;width:0;background:var(--accent)}
#rest.done{background:var(--green-bg)}
#rest.done .rest-time{color:var(--green)}
#rest.done .rest-bar i{background:var(--green)}
body.timing .wrap{padding-bottom:150px}
.restsel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.restsel .segb{padding:5px 10px;font-size:13px}
/* status dashboard */
.cyc{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.cyc div{border-radius:6px;padding:6px 4px;text-align:center;font-size:11.5px;font-weight:700;border:2px solid transparent;display:flex;flex-direction:column;gap:1px}
.cyc div small{font-weight:500;font-family:var(--f-mono);font-size:10.5px}
.cyc .past{opacity:.55}
.cyc .now{border-color:var(--ink)}
.miles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.miles{grid-template-columns:minmax(0,1fr)}}
.mile{display:flex;flex-direction:column;gap:1px;min-width:0}
.mile .big{font-size:34px}
.mile .l{font-size:12px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.06em}
.wkdots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wkdots div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.wkdots i{font-style:normal;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;border:2px solid var(--line);color:var(--muted)}
.wkdots i.done{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.wkdots i.missed{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.wkdots i.today{border-color:var(--accent);color:var(--accent)}
.wkdots i.rest{border-style:dashed;opacity:.6}
.sm-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:620px){.sm-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sm{display:flex;flex-direction:column;gap:4px;min-width:0}
.sm-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sm-h b{font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.sm-h .v{font-family:var(--f-display);font-stretch:70%;font-weight:850;font-size:26px;font-variant-numeric:tabular-nums}
.sm-h .v small{font-size:13px;color:var(--muted);font-stretch:100%;font-weight:600;margin-left:3px}
.sm svg{width:100%;height:auto;display:block;overflow:visible}
.sm .none{font-size:13px;color:var(--muted);padding:18px 0;border-top:1px dashed var(--line)}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-ax{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.ch-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch-area{fill:var(--accent);opacity:.08}
.ch-pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.ch-pt.hollow{fill:var(--surface);stroke:var(--accent);stroke-dasharray:2 2}
.ch-end{fill:var(--ink);font-family:var(--f-mono);font-size:11px;font-weight:600}
.ch-hit{fill:transparent;cursor:pointer}
.ch-hit:focus-visible{outline:none;stroke:var(--accent);stroke-width:2}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;font-family:var(--f-mono);padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px))}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.segb{all:unset;cursor:pointer;padding:7px 12px;border-radius:8px;border:1px solid var(--line);font-size:14px;font-weight:600;background:var(--bg);min-width:20px;text-align:center}
.segb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.segb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{display:flex;flex-direction:column;gap:6px}
.q>span{font-size:14px;font-weight:650}
.q small{font-weight:500;color:var(--muted)}
.ci-grp{display:flex;flex-direction:column;gap:14px}
.ci-grp h4{margin:0;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ready{display:flex;align-items:center;gap:14px}
.ready .big{font-size:48px}
.sug{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.sug li{display:grid;grid-template-columns:8px minmax(0,1fr);gap:10px;font-size:14px}
.sug li::before{content:"";border-radius:4px;background:var(--line)}
.sug li.go::before{background:var(--green)}
.sug li.care::before{background:var(--yellow)}
.sug li.stop::before{background:var(--red)}
.sug li b{display:block}
details.wu{border-top:1px solid var(--line);padding-top:10px}
details.wu>summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:13px}
details.wu>summary::-webkit-details-marker{display:none}
details.wu>summary::before{content:"▸";color:var(--muted);width:10px}
details.wu[open]>summary::before{content:"▾"}
details.wu>summary .wu-t{font-weight:700;margin-right:4px}
details.wu>summary .chipw{font-family:var(--f-mono);background:var(--sunk);border-radius:6px;padding:2px 7px}
details.wu>summary .chipw.on{background:var(--accent-bg);color:var(--accent)}
.wu-body{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.wu-row{display:grid;grid-template-columns:44px minmax(0,1fr) 12px minmax(0,72px) 44px 28px;gap:6px;align-items:center}
.wu-lbl{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.wu-row input[type=number]{padding:7px 8px}
.wu-x{text-align:center;color:var(--muted)}
.wu-pl{grid-column:2 / -1;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:-3px}
.wu-chk{all:unset;cursor:pointer;height:38px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800}
.wu-chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wu-rm{all:unset;cursor:pointer;text-align:center;color:var(--muted);font-size:18px;line-height:1}
.wu-chk:focus-visible,.wu-rm:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.setb{all:unset;cursor:pointer;width:56px;height:52px;border-radius:9px;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:600;font-size:16px;line-height:1.05}
.setb small{font-size:10px;font-weight:500;color:var(--muted);font-family:var(--f-body);letter-spacing:.04em;text-transform:uppercase}
.setb.opt{border-style:dashed}
.setb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.setb.on small{color:var(--accent-ink)}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:650;color:var(--muted);min-width:0}
input[type=number],input[type=text],input[type=date],select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
textarea{min-height:64px;resize:vertical}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.num-in{max-width:110px}

/* lists / tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.cur td{background:var(--accent-bg)}
tr.past td{color:var(--muted)}
td input[type=number]{padding:5px 7px;width:84px;font-size:14px}
.wk-row{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.wk-row.cur{background:var(--accent-bg);margin-inline:-16px;padding-inline:16px}
.wk-row.past{opacity:.6}
.wk-date{font-family:var(--f-mono);font-size:13px}
.wk-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.wk-main .t{font-weight:700}
details.menu{position:relative}
details.menu summary{list-style:none;cursor:pointer;font-size:13px;font-weight:650;color:var(--accent);padding:4px 6px}
details.menu summary::-webkit-details-marker{display:none}
details.menu[open] .pop{display:flex}
.pop{position:absolute;right:0;top:100%;z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:none;flex-direction:column;gap:6px;min-width:190px;box-shadow:0 8px 24px rgb(0 0 0 / .18)}
.pop .lbl{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 4px}
details.plain summary{cursor:pointer;font-weight:650;font-size:14px}
ul.tight{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.guide h3{margin-top:4px}
.guide p{margin:0;max-width:65ch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{font-family:var(--f-mono);color:var(--muted)}
.kv dd{margin:0}
.ex{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px}
.empty{padding:18px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.setb{transition:background .12s,border-color .12s}}
</style>

</head>
<body>
<header>
  <div class="hd">
    <div class="brand"><h1>Operator <span>+</span> Black</h1><div id="status">Connecting…</div></div>
    <nav id="nav" aria-label="Sections">
      <button data-view="today">Today</button>
      <button data-view="status">Status</button>
      <button data-view="plan">Plan</button>
      <button data-view="history">History</button>
      <button data-view="setup">Setup</button>
      <button data-view="guide">Guide</button>
    </nav>
  </div>
</header>
<div class="wrap"><main id="main"></main></div>
<div id="tip" role="status" hidden></div>
<div id="rest" hidden aria-live="polite">
  <div class="rest-in">
    <div class="rest-txt"><span id="rest-lbl"></span><span id="rest-next"></span></div>
    <div id="rest-time" class="rest-time">0:00</div>
    <div class="rest-btns">
      <button class="btn sm" data-rest="-30" aria-label="30 seconds less">−30s</button>
      <button class="btn sm" data-rest="30" aria-label="30 seconds more">+30s</button>
      <button class="btn sm primary" data-rest="stop" id="rest-stop">Skip</button>
    </div>
  </div>
  <div class="rest-bar"><i id="rest-fill"></i></div>
</div>

<script>
(function(){
"use strict";
/* ---------------- constants ---------------- */
// Every lift the app knows. Lift 3 is one of L3K per session (see l3For).
const LK=['squat','bench','pull','ohp','wpu','dead'];
const L3K=['pull','ohp','wpu'];
const DAYN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PCT5={1:1,2:.95,3:.93,4:.9,5:.87,6:.85,7:.83,8:.8,9:.77,10:.75};
const HIC={
  map:{name:'MAP',sess:'8–10 × 1 min hard / 1 min easy',sys:'Max aerobic power'},
  anaerobic:{name:'Anaerobic',sess:'6–8 × 30 sec near-max / 2 min easy',sys:'Glycolytic'},
  threshold:{name:'Threshold',sess:'4 × 4 min hard / 3 min easy',sys:'Threshold / VO2'},
  long:{name:'Long HIC',sess:'5 × 3 min hard / 90 sec easy',sys:'Aerobic power'},
  liss:{name:'LISS',sess:'30–45 min conversational',sys:'Aerobic base'}
};
// Activities for HIC/LISS days. Each logs the measure that makes sense for it:
// [field, unit] for HIC and for LISS. Results only compare within one activity + format.
const MOD={
  echo:{name:'Echo bike',hic:['cal','cal'],liss:['cal','cal'],wu:'5 min easy spin, then 3 × 15 s at HIC pace with 45 s easy between.'},
  rower:{name:'Rower',hic:['cal','cal'],liss:['dist','m'],wu:'5 min easy row, then 3 × 15 s at HIC pace with 45 s easy between.'},
  ski:{name:'Ski erg',hic:['cal','cal'],liss:['dist','m'],wu:'5 min easy, then 3 × 15 s at HIC pace with 45 s easy between.'},
  run:{name:'Run / sprints',hic:['dist','m'],liss:['dist','mi'],wu:'5 min jog, leg swings, then 3–4 strides building up to HIC pace.',tip:'Running adds impact. Keep hard efforts smooth (about 90%) on MAP, threshold and long intervals, and save true sprints for anaerobic days. Hills are easier on the legs than flat sprints.'},
  cycle:{name:'Cycling',hic:['watts','avg W'],liss:['dist','mi'],wu:'10 min easy spin, then 3 × 15 s at HIC pace.'},
  ruck:{name:'Ruck',hic:['dist','mi'],liss:['dist','mi'],load:true,tip:'Build ruck load gradually, starting around 10–15% of bodyweight. Rucking loads the back and hips, so keep it easy before heavy squat or deadlift days.'},
  swim:{name:'Swim',hic:['dist','yd'],liss:['dist','yd'],wu:'200 easy, then 4 × 25 building to HIC pace.'},
  other:{name:'Other',hic:null,liss:null}
};
const PLYO=[
  {name:'Extensive',desc:'Bilateral, stick every landing',ex:[['Box jump, step down','4 × 5',20],['Broad jump, stick','4 × 5',20],['Lateral hurdle hop, stick','4 × 5',20]]},
  {name:'Unilateral + reactive',desc:'Single-leg work and quick ground contacts',ex:[['Single-leg box jump','3 × 4 / side',24],['Alternating bounds','4 × 6',24],['Lateral bound, stick','3 × 4 / side',24],['Hurdle hops, reactive','2 × 4',8]]},
  {name:'Elastic',desc:'Depth jumps and stiff, fast rebounds',ex:[['Depth jump','4 × 4',16],['Depth jump to broad jump','3 × 4',12],['Continuous hurdle hops','4 × 6',24],['Single-leg hops','3 × 6 / side',36]]}
];
const ACC={
  mon:['Horizontal pull: chest-supported row','Rear delt / upper back: face pull or reverse fly','Core: Pallof press or hanging knee raise','Arms: curls + triceps pushdown'],
  wed:['Arms: curls + triceps pushdown','Shoulders: DB lateral raise','Pull-up progression: negatives or band-assisted'],
  fri:['Single-leg: rear-foot-elevated split squat','Posterior chain: back extension or hamstring curl','Carry / grip: farmer carry']
};
const DEF={
  startMonday:'2026-09-28', bridge:true, unit:'lb', bar:45, bodyweight:null,
  maxes:{squat:null,bench:null,pull:null,ohp:null,wpu:null,dead:null},
  lift3Name:'Lat pulldown', machineNote:'',
  l3:{on:{pull:true,ohp:true,wpu:false},mode:'same',primary:'pull'},
  acc:null,
  basis:'1rm', tmPct:90,
  round:{squat:5,bench:5,pull:5,ohp:5,wpu:2.5,dead:5},
  wave:[{s:3,r:5,p:70},{s:3,r:5,p:80},{s:3,r:3,p:90},{s:3,r:5,p:75},{s:3,r:5,p:85},{s:3,r:2,p:95}],
  inc:{squat:10,bench:5,pull:5,ohp:5,wpu:2.5,dead:10},
  deloadEvery:2, testEvery:3,
  deload:{s:2,r:5,p:60},
  goal:'lose', sleepTarget:8, proteinPerLb:0.8,
  rest:{squat:3,bench:3,pull:2,ohp:3,wpu:3,dead:3},
  cardio:{def:'echo'},
  cycleMaxes:{}, inserts:{}, skips:{}
};

/* ---------------- state ---------------- */
let plan=clone(DEF), logs={}, planV=0;
let view='today', sel=todayStr(), planShow=26;
try{ const v=localStorage.getItem('ob.view'); if(v) view=v; }catch(e){}

/* ---------------- utils ---------------- */
function clone(o){return JSON.parse(JSON.stringify(o))}
function pad(n){return String(n).padStart(2,'0')}
function D(s){const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)}
function S(t){return new Date(t).toISOString().slice(0,10)}
function addDays(s,n){return S(D(s)+n*864e5)}
function todayStr(){const n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())}
function dow(s){return (new Date(D(s)).getUTCDay()+6)%7}
function mondayOf(s){return addDays(s,-dow(s))}
function fmtD(s,withDow){const d=new Date(D(s));const t=(d.getUTCMonth()+1)+'/'+d.getUTCDate();return withDow?DAYN[dow(s)]+' '+t:t}
function fmtLong(s){const d=new Date(D(s));return DAYN[dow(s)]+', '+MON[d.getUTCMonth()]+' '+d.getUTCDate()+(d.getUTCFullYear()!==new Date().getFullYear()?', '+d.getUTCFullYear():'')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rnd(x,inc){inc=+inc||5;return Math.round(x/inc)*inc}
function floorTo(x,inc){inc=+inc||5;return Math.floor(x/inc+1e-9)*inc}
function n(x){if(x==null||x==='')return '—';const v=Math.round(x*100)/100;return String(v)}
function deepMerge(base,over){if(!over||typeof over!=='object')return base;for(const k of Object.keys(over)){const v=over[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k]))base[k]=deepMerge(base[k],v);else base[k]=v}return base}
function setPath(o,path,v){const ks=path.split('.');let c=o;for(let i=0;i<ks.length-1;i++){if(c[ks[i]]==null||typeof c[ks[i]]!=='object')c[ks[i]]=/^\d+$/.test(ks[i+1])?[]:{};c=c[ks[i]]}c[ks[ks.length-1]]=v}
function getPath(o,path){return path.split('.').reduce((c,k)=>c==null?undefined:c[k],o)}
function liftName(k){return k==='pull'?(plan.lift3Name||'Lat pulldown'):{squat:'Squat',bench:'Bench',dead:'Deadlift',ohp:'Overhead press',wpu:'Weighted pull-up'}[k]}
function l3On(){const on=(plan.l3&&plan.l3.on)||{};const xs=L3K.filter(k=>on[k]);return xs.length?xs:['pull']}
function activeLifts(){return ['squat','bench',...l3On(),'dead']}
function isBarbell(k){return k!=='pull'&&k!=='wpu'}
function isBW(k){return k==='wpu'}
// Which Lift 3 variant a session uses: a per-day swap wins, otherwise the rotation rule.
function l3Auto(date){
  const on=l3On(); if(on.length===1) return on[0];
  const mode=(plan.l3||{}).mode||'same';
  if(mode==='same') return on.includes(plan.l3.primary)?plan.l3.primary:on[0];
  const wk=weekOf(date); if(!wk) return on[0];
  const wi=wk.kind==='cycle'?wk.plyoIdx:wk.idx;
  const k=mode==='alt-day'?wi*2+(dow(date)===2?1:0):mode==='alt-week'?wi:(wk.kind==='cycle'?wk.cycle:wk.refCycle)-1;
  return on[((k%on.length)+on.length)%on.length];
}
function l3For(date){const o=(logs[date]||{}).l3;return o&&l3On().includes(o)?o:l3Auto(date)}
// Working load. Weighted pull-up percentages apply to bodyweight + added weight;
// the result is the weight to add (0 or less = bodyweight only).
function loadFor(k,max,pct,date){
  if(isBW(k)){const bw=latestBw(date||sel);if(!bw)return null;return rnd((bw+max)*mult()*pct/100-bw,plan.round[k])}
  return rnd(max*mult()*pct/100,plan.round[k]);
}
function estMax(k,w,r,date){
  if(w==null||w===''||!r) return null;
  if(isBW(k)){const bw=latestBw(date||sel);if(!bw)return null;const e=e1rm(bw+ +w,r);return e==null?null:e-bw}
  return e1rm(w,r);
}
function fmtLoad(k,w){return isBW(k)?(w>0?'+'+n(w):'BW'):n(w)}
function mult(){return plan.basis==='tm'?(+plan.tmPct||90)/100:1}
function tier(p){return p<=75?'light':p>=90?'heavy':'mid'}
function e1rm(w,r){w=+w;r=+r;if(!w||!r)return null;return w/(PCT5[r]||1/(1+r/30))}
function u(){return plan.unit||'lb'}

/* ---------------- schedule engine ---------------- */
function* ruleSeq(p){
  if(p.bridge) yield {kind:'bridge'};
  for(let c=1;;c++){
    for(let w=1;w<=6;w++) yield {kind:'cycle',cycle:c,w};
    const t=+p.testEvery>0&&c%+p.testEvery===0, d=+p.deloadEvery>0&&c%+p.deloadEvery===0;
    if(t&&!p.skips['test@'+c]) yield {kind:'test',after:c,rule:'test@'+c};
    else if(d&&!p.skips['deload@'+c]) yield {kind:'deload',after:c,rule:'deload@'+c};
  }
}
let wcache={v:-1,list:[]};
function weeks(minIdx){
  const need=Math.max(minIdx||0, idxOf(todayStr())+160, 60);
  if(wcache.v===planV&&wcache.list.length>need) return wcache.list;
  const out=[], g=ruleSeq(plan); let m=plan.startMonday, cw=0, lastC=0;
  for(let i=0;i<=need+10;i++){
    let wk; const ins=plan.inserts[m];
    if(ins) wk={kind:ins,inserted:true}; else wk=g.next().value;
    wk=Object.assign({},wk,{monday:m,idx:i});
    if(wk.kind==='cycle'){wk.plyoIdx=cw++;lastC=wk.cycle}
    wk.refCycle=wk.after||lastC||1;
    out.push(wk); m=addDays(m,7);
  }
  // for tests/inserts, find the cycle that follows
  for(let i=out.length-1,next=null;i>=0;i--){ if(out[i].kind==='cycle'&&out[i].w===1) next=out[i].cycle; out[i].nextCycle=next; }
  wcache={v:planV,list:out}; return out;
}
function idxOf(date){return Math.floor((D(mondayOf(date))-D(plan.startMonday))/(7*864e5))}
function weekOf(date){const i=idxOf(date);if(i<0)return null;return weeks(i+10)[i]}
let mcache={v:-1,m:{}};
function maxFor(c){
  if(mcache.v!==planV) mcache={v:planV,m:{}};
  if(mcache.m[c]) return mcache.m[c];
  const o=(plan.cycleMaxes||{})[c]||{}, prev=c>1?maxFor(c-1):null, r={};
  for(const k of LK){
    if(o[k]!=null&&o[k]!=='') r[k]={v:+o[k],src:'set'};
    else if(c===1) r[k]=plan.maxes[k]!=null&&plan.maxes[k]!==''?{v:+plan.maxes[k],src:'base'}:null;
    else r[k]=prev[k]?{v:prev[k].v+(+plan.inc[k]||0),src:'proj'}:null;
  }
  return mcache.m[c]=r;
}
function rx(wk,k){
  let s,r,p,c;
  if(wk.kind==='cycle'){const v=plan.wave[wk.w-1];s=+v.s;r=+v.r;p=+v.p;c=wk.cycle}
  else {const v=plan.deload;s=+v.s;r=+v.r;p=+v.p;c=wk.refCycle}
  if(k==='dead'&&wk.kind!=='cycle') s=1;
  const m=maxFor(c)[k];
  return {s,r,p,c,m,w:m?loadFor(k,m.v,p,sel):null,t:wk.kind==='cycle'?tier(p):'light'};
}
function dayPlan(date){
  const wk=weekOf(date); if(!wk) return {t:'pre'};
  const d=dow(date), SBP=['squat','bench',l3For(date)], SBD=['squat','bench','dead'];
  if(wk.kind==='cycle') return [
    {t:'lift',day:1,lifts:SBP,acc:'mon',short:'Op 1'},
    {t:'hic',fmt:'map',short:'HIC'},
    {t:'lift',day:2,lifts:SBP,acc:'wed',short:'Op 2'},
    {t:'plyohic',fmt:'anaerobic',short:'Plyo+HIC'},
    {t:'lift',day:3,lifts:SBD,acc:'fri',short:'Op 3'},
    {t:'hic',fmt:wk.w%2?'threshold':'long',short:'HIC',note:'Swap to LISS if the week has been heavy.'},
    {t:'off',short:'Off'}][d];
  if(wk.kind==='deload') return [
    {t:'lift',deload:true,lifts:SBP,short:'Lift'},
    {t:'hic',fmt:'liss',short:'LISS'},
    {t:'lift',deload:true,lifts:SBP,short:'Lift'},
    {t:'plyohic',fmt:'liss',plyoCut:true,short:'Plyo+LISS'},
    {t:'lift',deload:true,lifts:SBD,short:'Lift'},
    {t:'hic',fmt:'liss',short:'LISS',note:'Optional. Take it off if you feel flat.'},
    {t:'off',short:'Off'}][d];
  if(wk.kind==='test') return [
    {t:'hic',fmt:'liss',short:'Easy',note:'Easy day. 20–30 min of conversational cardio.'},
    {t:'off',short:'Easy',note:'Easy day. Mobility only: the warm-up hip and t-spine work.'},
    {t:'hic',fmt:'liss',short:'Easy',note:'Easy day. 20–30 min of conversational cardio.'},
    {t:'test',lifts:['squat','bench'],jumps:true,short:'Test'},
    {t:'off',short:'Off'},
    {t:'test',lifts:['dead',...l3On()],pullups:true,apply:true,short:'Test'},
    {t:'off',short:'Off'}][d];
  if(wk.kind==='bridge') return [
    {t:'off',short:'—',note:'Bridge week starts Tuesday.'},
    {t:'rm5',lifts:['squat','bench'],short:'5RM'},
    {t:'hic',fmt:'map',baseline:true,short:'HIC',note:'Baseline: 8 × 1 min. Record total calories.'},
    {t:'plyobase',short:'Jumps'},
    {t:'rm5',lifts:['dead',l3On()[0]],short:'5RM'},
    l3On().length>1?{t:'rm5',lifts:l3On().slice(1),short:'5RM+Spin',note:'Test these first (two per day keeps the numbers honest), then 30–40 min of easy cardio.'}:{t:'hic',fmt:'liss',short:'Easy',note:'30–40 min easy cardio.'},
    {t:'convert',short:'Maxes'}][d];
  return {t:'off',short:'Off',note:'Off week. Walk, sleep, eat. The plan resumes next Monday.'};
}
function weekTitle(wk){
  if(!wk) return 'Before start';
  if(wk.kind==='cycle'){const v=plan.wave[wk.w-1];return {t:'Cycle '+wk.cycle+' · Week '+wk.w,chip:v.s+'×'+v.r+' @ '+v.p+'%',cls:tier(+v.p)}}
  if(wk.kind==='deload') return {t:'Deload week',chip:plan.deload.s+'×'+plan.deload.r+' @ '+plan.deload.p+'%',cls:'light'};
  if(wk.kind==='test') return {t:'Retest week',chip:'Heavy singles',cls:'heavy'};
  if(wk.kind==='bridge') return {t:'Bridge week',chip:'Calibration',cls:'blue'};
  return {t:'Off week',chip:'Rest',cls:''};
}
function plyoPhase(wk){ if(wk.kind==='cycle') return PLYO[Math.floor((wk.plyoIdx%9)/3)]; return PLYO[0]; }
function holidays(y){
  const nth=(m,wd,k)=>{const f=new Date(Date.UTC(y,m,1)).getUTCDay();return S(Date.UTC(y,m,1+((wd-f+7)%7)+7*(k-1)))};

}
function holidayOn(date){return holidays(+date.slice(0,4))[date]||null}
function effFmt(date){const L=logs[date];const dp=dayPlan(date);return (L&&L.hic&&L.hic.format)||dp.fmt}
function defMod(){const m=(plan.cardio||{}).def;return MOD[m]?m:'echo'}
// Sessions logged before activities existed have calories but no activity: they were on the Echo bike.
function modOf(date){const H=(logs[date]||{}).hic;if(H&&MOD[H.mod])return H.mod;if(H&&H.cal!=null&&H.cal!=='')return 'echo';return defMod()}
function metricFor(mod,fmt){const m=MOD[mod]&&MOD[mod][fmt==='liss'?'liss':'hic'];if(!m)return null;let un=m[1];if(u()==='kg'){if(un==='mi')un='km';if(un==='yd')un='m'}return [m[0],un]}

function hicSessions(){

/* ---------------- persistence ---------------- */
// One JSON document per path (plan/main, logs/YYYY-MM-DD), stored in D1 behind /api.
// The phone keeps its own copy (ob.cache) so the app opens offline, and an outbox of
// unsent documents (ob.outbox) so changes made offline survive closing the app.
// Writes are debounced per document; failed writes retry until they land.
const writers={};
let loaded=false, signedOut=false;
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
let outbox=LS.get('ob.outbox')||{};
function saveOutbox(){LS.set('ob.outbox',outbox)}
let cacheTimer=null;
function saveCache(){clearTimeout(cacheTimer);cacheTimer=setTimeout(()=>LS.set('ob.cache',{plan,logs}),800)}
function pending(path){const w=writers[path];return !!(w&&(w.dirty||w.busy||w.timer))||!!outbox[path]}
function anyPending(){return Object.keys(writers).some(pending)||Object.keys(outbox).length>0}
function waitingCount(){return Object.keys(outbox).length}
async function api(method,path,body){
  const r=await fetch('/api'+path,{method,credentials:'same-origin',cache:'no-store',redirect:'manual',
    headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  // An expired Access session answers with a redirect to the login page.
  if(r.type==='opaqueredirect'){const e=new Error('signed out');e.status=401;throw e}
  if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}
  return r.status===204?null:r.json();
}
function errText(e){
  if(e&&(e.status===401||e.status===403)) return 'Signed out · tap to sign in';
  if(e&&e.status===413) return 'Entry too large to save';
  const w=waitingCount();
  if(e&&e.status) return 'Server error '+e.status+' · retrying';
  return 'Offline'+(w?' · '+w+' waiting':' · saved on phone');
}
function queueWrite(path,get){
  if(!loaded){setStatus('Still loading…',true);return}
  const w=writers[path]||(writers[path]={});
  w.get=get;w.dirty=true;clearTimeout(w.timer);
  outbox[path]=clone(get()); saveOutbox(); saveCache();
  setStatus(navigator.onLine===false?errText(null):'Saving…',navigator.onLine===false);
  w.timer=setTimeout(()=>{w.timer=null;flush(path)},500);
}
async function flush(path){
  const w=writers[path]||(writers[path]={get:()=>outbox[path]});
  if(w.busy){w.again=true;return} if(!w.dirty)return;
  w.dirty=false;w.busy=true;
  const body=clone(w.get()), sent=JSON.stringify(body);
  try{
    await api('PUT','/doc/'+path,body);
    if(outbox[path]&&JSON.stringify(outbox[path])===sent){delete outbox[path];saveOutbox()}
    signedOut=false; if(!anyPendingExcept(path)) setStatus('Saved');
  }
  catch(e){
    if(e&&(e.status===401||e.status===403)) signedOut=true;
    setStatus(errText(e),true);
    if(!(e&&e.status===413)){ w.dirty=true; clearTimeout(w.timer); w.timer=setTimeout(()=>{w.timer=null;flush(path)},signedOut?30000:5000) }
  }
  w.busy=false; if(w.dirty&&!w.timer||w.again){w.again=false;flush(path)}
}
function anyPendingExcept(path){return Object.keys(writers).some(p=>p!==path&&pending(p))||Object.keys(outbox).some(p=>p!==path)}
function setStatus(t,err){const el=document.getElementById('status');el.textContent=t;el.className=err?'err':'';el.classList.toggle('link',signedOut)}
function setLog(date,path,v){ if(!logs[date]) logs[date]={date}; setPath(logs[date],path,v); queueWrite('logs/'+date,()=>logs[date]); }
function setPlan(path,v){ setPath(plan,path,v); planV++; queueWrite('plan/main',()=>plan); }
function mutatePlan(fn){ fn(plan); planV++; queueWrite('plan/main',()=>plan); render(); }

function applyState(st){
  let changed=false;
  if(!pending('plan/main')){
    const next=st.plan?deepMerge(clone(DEF),st.plan):clone(DEF);
    if(JSON.stringify(next)!==JSON.stringify(plan)){plan=next;planV++;changed=true}
  }
  for(const [id,d] of Object.entries(st.logs||{})){
    if(pending('logs/'+id)) continue;
    if(JSON.stringify(d)!==JSON.stringify(logs[id])){logs[id]=d;changed=true}
  }
  saveCache();
  if(changed) render();
}
// Open instantly from the phone's copy, with any unsent changes laid on top.
function loadLocal(){
  const c=LS.get('ob.cache');
  if(c){ if(c.plan) plan=deepMerge(clone(DEF),c.plan); logs=c.logs||{}; }
  for(const [path,doc] of Object.entries(outbox)){
    if(path==='plan/main') plan=deepMerge(clone(DEF),doc);
    else if(path.startsWith('logs/')) logs[path.slice(5)]=doc;
    const w=writers[path]={get:()=>path==='plan/main'?plan:logs[path.slice(5)],dirty:true};
  }
  planV++;
  if(c||Object.keys(outbox).length) loaded=true;
  return !!c;
}
function flushAll(){for(const p of new Set([...Object.keys(writers),...Object.keys(outbox)])){const w=writers[p]||(writers[p]={get:()=>p==='plan/main'?plan:logs[p.slice(5)]});if(outbox[p])w.dirty=true;if(w.dirty){clearTimeout(w.timer);w.timer=null;flush(p)}}}
async function connect(){
  if(!loaded) setStatus('Loading…');
  try{
    const st=await api('GET','/state'); signedOut=false; loaded=true; applyState(st);
    flushAll(); if(!anyPending()) setStatus('Saved');
  }
  catch(e){
    if(e&&(e.status===401||e.status===403)) signedOut=true;
    setStatus(loaded?errText(e):(signedOut?'Signed out · tap to sign in':'Can’t reach server · reload'),true);
  }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') connect() });
window.addEventListener('online',()=>{ flushAll(); connect() });
window.addEventListener('offline',()=>setStatus(errText(null),true));
document.getElementById('status').addEventListener('click',()=>{ if(signedOut) location.replace('/') });

/* ---------------- rendering helpers ---------------- */
function numIn(bind,val,ph,attrs){return `<input type="number" inputmode="decimal" step="any" id="in-${bind.replace(/\./g,'-')}" data-bind="${bind}" data-type="num" value="${val??''}" placeholder="${esc(ph??'')}" ${attrs||''}>`}
function lg(date){return logs[date]||{}}
function ramp(k,W,t,deload){

  if(!W) return [];
  const inc=plan.round[k], bar=+plan.bar; let st;

  else if(deload) st=[[0,10],[50,5]];

  return st.map(([p,r])=>({w:p===0?bar:(k==='pull'?rnd(W*p/100,inc):Math.max(bar,rnd(W*p/100,inc))),r,lbl:p===0?'Bar':p+'%'}));
}
function plates(W){
  const bar=+plan.bar; let side=(W-bar)/2; if(side<=0) return 'Empty bar';
  const P=u()==='kg'?[25,20,15,10,5,2.5,1.25]:[45,35,25,10,5,2.5], out=[];
  for(const p of P) while(side>=p-1e-9){out.push(p);side-=p}
  return 'Per side: '+out.join(' + ')+(side>0.01?' + '+n(side):'');
}
function platesShort(W){
  const bar=+plan.bar; let side=(W-bar)/2; if(!(W>0)) return ''; if(side<=0) return 'bar';
  const P=u()==='kg'?[25,20,15,10,5,2.5,1.25]:[45,35,25,10,5,2.5], out=[];
  for(const p of P) while(side>=p-1e-9){out.push(p);side-=p}

}
function testRamp(k,W,isRm5){
  if(isBW(k)) return W==null?[]:W>0?[{w:0,r:5,lbl:'BW'},{w:rnd(W*.5,plan.round[k]),r:2,lbl:'50%'},{w:rnd(W*.75,plan.round[k]),r:1,lbl:'75%'}]:[{w:0,r:3,lbl:'BW'}];

  return st.map(([p,r])=>({w:p===0?bar:(k==='pull'?rnd(W*p/100,inc):Math.max(bar,rnd(W*p/100,inc))),r,lbl:p===0?'Bar':p+'%'}));

function hardSessions(){
  const t=todayStr(), from=addDays(t,-13); let c=0;

}

}

function lineChart(pts,o){

      if(wk.inserted) opts.push(`<button class="btn sm" data-act="uninsert" data-monday="${wk.monday}">Remove this week</button>`);
      else if(wk.rule) opts.push(`<button class="btn sm" data-act="skip" data-rule="${wk.rule}">Skip this ${wk.kind==='test'?'retest':'deload'}</button>`);
      if(!wk.inserted) opts.push(`<span class="lbl">Insert this week</span>${['deload','test','off'].map(k=>`<button class="btn sm" data-act="insert" data-kind="${k}" data-monday="${wk.monday}">${{deload:'Deload',test:'Retest',off:'Off week'}[k]}</button>`).join('')}`);
      menu=`<details class="menu"><summary>Change</summary><div class="pop">${opts.join('')}</div></details>`;
    }
    h+=`<div class="wk-row${cur?' cur':''}${past?' past':''}"><div class="wk-date">${fmtD(wk.monday)}–${fmtD(addDays(wk.monday,6))}</div><div class="wk-main"><div class="row" style="gap:8px"><span class="t">${wt.t}</span><span class="chip ${wt.cls}">${wt.chip}</span>${wk.inserted?'<span class="chip">Added</span>':''}</div>${sub.length?`<div class="small muted">${esc(sub.join(' · '))}</div>`:''}</div><div class="row" style="gap:6px;justify-content:flex-end">${done?`<span class="small mono muted">${done}/${tot}</span>`:''}${menu}</div></div>`;
  }
  h+=`</div><div class="row"><button class="btn" data-act="more">Show 26 more weeks</button></div>`;
  const sk=Object.keys(plan.skips||{}).filter(k=>plan.skips[k]);
  if(sk.length) h+=`<div class="card"><h3>Skipped</h3><div class="row">${sk.map(k=>{const [kind,c]=k.split('@');return `<button class="btn sm" data-act="unskip" data-rule="${k}">Restore ${kind==='test'?'retest':'deload'} after Cycle ${c}</button>`}).join('')}</div></div>`;
  return h;
}

function vHistory(){
  const t=todayStr(), wk=weekOf(t), curC=wk?(wk.kind==='cycle'?wk.cycle:(wk.nextCycle||wk.refCycle)):1;
  const list=weeks(), range={};
  for(const w of list){ if(w.kind==='cycle'){ (range[w.cycle]||(range[w.cycle]={a:w.monday,b:w.monday})).b=w.monday } }
  let h=`<div class="card"><h2>Maxes by cycle</h2><p class="small muted" style="margin:0">Type a number to override a cycle. Blank cells follow the previous cycle plus the increment. Later cycles update automatically.</p><div class="tbl-wrap"><table><thead><tr><th>Cycle</th><th>Dates</th>${activeLifts().map(k=>`<th class="n">${esc(liftName(k))}</th>`).join('')}</tr></thead><tbody>`;
  for(let c=1;c<=curC+2;c++){
    const m=maxFor(c), r=range[c], o=plan.cycleMaxes[c]||{};
    h+=`<tr class="${c===curC?'cur':c<curC?'past':''}"><td><b>${c}</b></td><td class="small mono">${r?fmtD(r.a)+'–'+fmtD(addDays(r.b,4)):''}</td>${activeLifts().map(k=>c===1&&(o[k]==null||o[k]==='')?`<td class="n"><span title="Set in Setup">${m[k]?n(m[k].v):'—'}</span></td>`:`<td class="n"><input type="number" inputmode="decimal" step="any" id="cm-${c}-${k}" data-cmax="${c}.${k}" value="${o[k]??''}" placeholder="${m[k]?n(m[k].v):''}" aria-label="Cycle ${c} ${esc(liftName(k))}"></td>`).join('')}</tr>`;
  }
  h+=`</tbody></table></div></div>`;
  // Recovery
  const cis=Object.entries(logs).filter(([d,L])=>L.checkin&&readiness(L.checkin)!=null).sort((a,b)=>a[0]<b[0]?1:-1).slice(0,14);
  h+=`<div class="card"><h2>Recovery</h2>`;
  if(!cis.length) h+=`<div class="empty">No check-ins yet. Answer the daily check-in on the Today tab and your readiness trend shows up here.</div>`;
  else{
    const avg=(f)=>{const xs=cis.slice(0,7).map(([d,L])=>L.checkin[f]).filter(v=>v!=null&&v!=='').map(Number);return xs.length?(xs.reduce((a,b)=>a+b,0)/xs.length):null};
    const ar=cis.slice(0,7).map(([d,L])=>readiness(L.checkin));const ra=ar.reduce((a,b)=>a+b,0)/ar.length;
    h+=`<div class="grid3"><div class="stack" style="gap:2px"><span class="small muted">Readiness · last 7</span><span class="big" style="font-size:32px">${Math.round(ra)}</span></div><div class="stack" style="gap:2px"><span class="small muted">Sleep · last 7</span><span class="big" style="font-size:32px">${avg('sleepH')!=null?avg('sleepH').toFixed(1):'—'}<small>h</small></span></div><div class="stack" style="gap:2px"><span class="small muted">Bodyweight</span><span class="big" style="font-size:32px">${latestBw(todayStr())?n(latestBw(todayStr())):'—'}<small>${u()}</small></span></div></div>`;
    h+=`<div class="tbl-wrap"><table><thead><tr><th>Date</th><th class="n">Ready</th><th class="n">Sleep</th><th class="n">Energy</th><th class="n">Sore</th><th class="n">BW</th></tr></thead><tbody>${cis.map(([d,L])=>{const c=L.checkin,r=readiness(c),lv=rLevel(r);return `<tr><td>${fmtD(d,true)}</td><td class="n"><span class="chip ${lv.cls}">${r}</span></td><td class="n">${c.sleepH!=null&&c.sleepH!==''?n(c.sleepH):'—'}</td><td class="n">${c.energy||'—'}</td><td class="n">${c.soreness||'—'}</td><td class="n">${c.bw?n(c.bw):'—'}</td></tr>`}).join('')}</tbody></table></div>`;
  }
  h+=`</div>`;
  // HIC
  const hic=hicSessions().reverse();
  h+=`<div class="card"><h2>Conditioning</h2>`;
  if(!hic.length) h+=`<div class="empty">No conditioning logged yet. Results you enter on HIC and LISS days show up here.</div>`;
  else{
    const groups={};for(const x of hic) if(x.f!=='liss'&&x.v!=null)(groups[x.mod+'|'+x.f]=groups[x.mod+'|'+x.f]||[]).push(x);
    const top=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length).slice(0,4);
    if(top.length) h+=`<div class="grid4">${top.map(key=>{const xs=groups[key],[m,f]=key.split('|'),b=xs.reduce((a,x)=>Math.max(a,x.v),0);return `<div class="stack" style="gap:2px"><span class="small muted">${MOD[m].name} · ${HIC[f].name}</span><span class="big" style="font-size:32px">${n(b)}<small style="font-size:13px;color:var(--muted);margin-left:3px">${esc(xs[0].u)}</small></span><span class="small muted">best · ${xs.length} logged</span></div>`}).join('')}</div>`;
    h+=`<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Format</th><th>Activity</th><th class="n">Result</th></tr></thead><tbody>${hic.slice(0,20).map(x=>`<tr><td>${fmtD(x.d,true)}</td><td>${HIC[x.f].name}</td><td>${esc(x.mod==='other'&&x.what?x.what:MOD[x.mod].name)}${x.load?` <span class="small muted">(${n(x.load)} ${u()})</span>`:''}</td><td class="n">${[x.v!=null?n(x.v)+' '+x.u:'',x.min?x.min+' min':''].filter(Boolean).join(' · ')||'—'}</td></tr>`).join('')}</tbody></table></div>`;
  }
  h+=`</div>`;
  // Jumps
  const jm=Object.entries(logs).filter(([d,L])=>(L.plyo&&L.plyo.mark)||(L.jumps&&(L.jumps.broad||L.jumps.vertical))).sort((a,b)=>a[0]<b[0]?1:-1);
  h+=`<div class="card"><h2>Jumps</h2>`;
  h+=jm.length?`<div class="tbl-wrap"><table><thead><tr><th>Date</th><th class="n">Broad</th><th class="n">Vertical</th><th class="n">Triple</th></tr></thead><tbody>${jm.slice(0,15).map(([d,L])=>`<tr><td>${fmtD(d,true)}</td><td class="n">${n((L.jumps&&L.jumps.broad)||(L.plyo&&L.plyo.mark))}</td><td class="n">${n(L.jumps&&L.jumps.vertical)}</td><td class="n">${n(L.jumps&&L.jumps.triple)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No jumps logged yet. Thursday's first broad jump and test-week jumps land here.</div>`;
  h+=`</div>`;
  // Sessions
  const ss=Object.entries(logs).filter(([d,L])=>L.done||L.notes).sort((a,b)=>a[0]<b[0]?1:-1).slice(0,20);
  h+=`<div class="card"><h2>Recent sessions</h2>`+(ss.length?`<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Session</th><th class="n">RPE</th><th>Notes</th></tr></thead><tbody>${ss.map(([d,L])=>`<tr><td><button class="btn sm ghost" data-act="open" data-date="${d}">${fmtD(d,true)}</button></td><td>${esc(dayPlan(d).short||'')}</td><td class="n">${L.rpe||'—'}</td><td class="small">${esc((L.notes||'').slice(0,80))}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Sessions you mark done appear here.</div>`)+`</div>`;
  return h;
}

function pIn(path,val,attrs){return `<input type="number" inputmode="decimal" step="any" id="p-${path.replace(/\./g,'-')}" data-pbind="${path}" data-type="num" value="${val??''}" ${attrs||''}>`}

  <div class="stack">${L3K.map(k=>`<label class="check"><input type="checkbox" id="l3-${k}" data-pbind="l3.on.${k}" ${on.includes(k)&&(L3.on||{})[k]?'checked':''}> ${esc(liftName(k))}${k==='wpu'?' <span class="small muted">(percentages use bodyweight + added weight)</span>':''}</label>`).join('')}</div>

  ${on.includes('pull')?`<div class="grid2"><label class="f">Pulldown name<input type="text" id="p-l3" data-pbind="lift3Name" value="${esc(plan.lift3Name)}"></label><label class="f">Machine and pin setting<input type="text" id="p-mn" data-pbind="machineNote" value="${esc(plan.machineNote)}" placeholder="e.g. Hammer Strength pulldown, seat 4"></label></div>`:''}
  ${on.some(k=>plan.maxes[k]==null||plan.maxes[k]==='')?`<div class="banner warn"><div class="small">Add a 1RM above for ${on.filter(k=>plan.maxes[k]==null||plan.maxes[k]==='').map(liftName).join(' and ')}. Until then its sessions show no working weight.</div></div>`:''}</div>`;

  <div class="grid2"><label class="f">Deload after every N cycles (0 = never)${pIn('deloadEvery',plan.deloadEvery)}</label><label class="f">Retest after every N cycles (0 = never)${pIn('testEvery',plan.testEvery)}</label></div>
  <p class="small muted" style="margin:0">A retest week doubles as a deload: 3 easy days, then heavy singles. When both land on the same cycle, the retest wins.</p>

  <div class="banner"><div class="small">Changing the start date, bridge week, or these rules re-plans the whole calendar from the start. Logged sessions stay on their dates.</div></div></div>`;
  h+=`<div class="card"><h2>Backup</h2><p class="small muted" style="margin:0">Download everything (plan, maxes and every logged session) as one JSON file.</p><div><a class="btn" href="/api/export">Download backup</a></div></div>`;
  return h;
}
let calc5={};

function vGuide(){
  return `<div class="card guide"><h2>How the week works</h2><p>Operator keeps strength work minimal and sub-maximal so conditioning can carry the real weekly load. Three lifts, three sets, never near failure.</p>
  <dl class="kv"><dt>Mon</dt><dd>Operator Day 1: squat, bench, Lift 3 + accessories</dd><dt>Tue</dt><dd>HIC: MAP</dd><dt>Wed</dt><dd>Operator Day 2: squat, bench, Lift 3 + accessories</dd><dt>Thu</dt><dd>Plyos first, rest 10 min, then HIC: Anaerobic</dd><dt>Fri</dt><dd>Operator Day 3: squat, bench, deadlift + accessories</dd><dt>Sat</dt><dd>HIC: Threshold / Long HIC alternating, or LISS after a heavy week</dd><dt>Sun</dt><dd>Off</dd></dl></div>
  <div class="card guide"><h3>Strength rules</h3><ul class="tight"><li>Sets can range 3–5 depending on what you can handle. Deadlift stays 1–3 sets.</li><li>Minimum 2 min rest between sets; 5 min on heavy squat and deadlift weeks.</li><li>If a set grinds at 70–80%, your max is too high. Lower it rather than pushing through.</li><li>Ramp: skip the 85% single on light weeks; add a 90% single on heavy weeks. Deadlift needs only 2–3 ramp sets; Lift 3 needs one light set of 10 and one at 70%.</li></ul></div>
  <div class="card guide"><h3>Conditioning: Black</h3><div class="tbl-wrap"><table><thead><tr><th>Format</th><th>Session</th><th>System</th></tr></thead><tbody>${Object.values(HIC).map(x=>`<tr><td><b>${x.name}</b></td><td>${x.sess}</td><td class="small muted">${x.sys}</td></tr>`).join('')}</tbody></table></div><ul class="tight"><li>Black sets the dose, not the tool. The ${MOD[defMod()].name.toLowerCase()} is your default; switch activity on any HIC or LISS day (sprints, rower, cycling, ruck, swim and more).</li><li>Keep the format and activity fixed to track progress. Results only compare within the same activity.</li><li>If most sessions are on a bike, watch hip flexors and saddle position: it compounds with squats and deadlifts.</li><li>Running and rucking add impact and back load. On Thursdays, plyos come first, so keep sprint volume low that day.</li></ul></div>
  <div class="card guide"><h3>Plyometrics</h3><p>A nervous-system stimulus, not a workout. Phases rotate every 3 training weeks: Extensive (~60 contacts) → Unilateral + reactive (~80) → Elastic with depth jumps (~90). Deload weeks use the extensive set at half volume.</p><ul class="tight"><li><b>Watch distance, not set count.</b> If any jump drops more than 5% off your first broad jump, the session is over.</li><li><b>Every rep maximal or near it.</b> If you're breathing hard, you're doing conditioning.</li><li><b>Cut, don't skip.</b> After a hard lifting week, halve the contacts.</li></ul><p class="small muted">Exercise picks in the app are suggestions. Your Plyometric Program PDF has the full library with cues.</p></div>
  <div class="card guide"><h3>Accessories</h3><ul class="tight"><li>After the main lifts, never before. 2–3 movements, 2–3 sets.</li><li>Skip entirely on heavy weeks and deloads.</li><li>Legs need almost nothing. Keep the pull-up progression in.</li></ul></div>
  <div class="card guide"><h3>Deloads and retests</h3><p>Deload weeks drop to ${plan.deload.s}×${plan.deload.r} @ ${plan.deload.p}% (deadlift 1 set), swap all HIC to LISS, halve plyos and drop accessories. Retest weeks take three easy days, then heavy singles split across Thursday (squat, bench, jumps) and Saturday (deadlift, Lift 3, max pull-ups). Saturday's card feeds results into the next cycle.</p><p>Need a deload sooner? Add one from the Plan tab, or from the warning on Today after repeated hard sessions.</p></div>
  <div class="card guide"><h3>Warm-up</h3>${warmupShort()}</div>`;
}

function val(t){ if(t.type==='checkbox') return t.checked; if(t.dataset.type==='num'||t.type==='number') return t.value===''?null:+t.value; return t.value; }
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.bind){ if(t.dataset.bind.startsWith('hic.')&&!(lg(sel).hic||{}).mod) setPath(logs[sel]||(logs[sel]={date:sel}),'hic.mod',modOf(sel)); setLog(sel,t.dataset.bind,val(t)); }
  else if(t.dataset.pbind){
    let v=val(t);
    if(t.dataset.pbind==='startMonday'){ if(!v) return; v=mondayOf(v); }
    setPlan(t.dataset.pbind,v);
  }
  else if(t.dataset.cmax){ const [c,k]=t.dataset.cmax.split('.'); const v=val(t); plan.cycleMaxes[c]=plan.cycleMaxes[c]||{}; if(v==null) delete plan.cycleMaxes[c][k]; else plan.cycleMaxes[c][k]=v; if(!Object.keys(plan.cycleMaxes[c]).length) delete plan.cycleMaxes[c]; planV++; queueWrite('plan/main',()=>plan); }
  else if(t.dataset.calc){ calc5[t.dataset.calc]=val(t); }
  else if(t.dataset.accday){ const d=t.dataset.accday, xs=t.value.split('\n').map(x=>x.trim()).filter(Boolean); plan.acc=Object.assign({},plan.acc||{},{[d]:xs}); planV++; queueWrite('plan/main',()=>plan); }
});
(function(){
  const tip=document.getElementById('tip');
  const show=el=>{const r=el.getBoundingClientRect();tip.textContent=el.dataset.tip;tip.style.left=(r.left+r.width/2)+'px';tip.style.top=(r.top)+'px';tip.hidden=false};
  const hide=()=>{tip.hidden=true};
  document.addEventListener('pointerover',e=>{const el=e.target.closest&&e.target.closest('.ch-hit');el?show(el):hide()});
  document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('.ch-hit');el?show(el):hide()});
  window.addEventListener('scroll',hide,{passive:true});
})();
document.addEventListener('toggle',e=>{const d=e.target;if(!d.matches)return;if(d.matches('details.wu')){d.open?openWarm.add(d.dataset.lift):openWarm.delete(d.dataset.lift)}else if(d.id&&d.id.startsWith('ci-')){const k=d.id.slice(3);d.open?openCI.add(k):openCI.delete(k)}},true);
document.addEventListener('change',e=>{ const t=e.target; if(t.dataset.bind||t.dataset.pbind||t.dataset.cmax||t.dataset.calc||t.dataset.accday) render(); });
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(!b)return;view=b.dataset.view;try{localStorage.setItem('ob.view',view)}catch(err){}render();window.scrollTo(0,0)});
document.getElementById('main').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if(a==='go'){sel=b.dataset.date;openWarm.clear();render();return}
  if(a==='open'){sel=b.dataset.date;view='today';render();window.scrollTo(0,0);return}
  if(a==='view'){view=b.dataset.view;render();window.scrollTo(0,0);return}
  if(a==='ci'){const f=b.dataset.f,raw=b.dataset.v,v=/^\d+(\.\d+)?$/.test(raw)?+raw:raw;setLog(sel,'checkin.'+f,ci(sel)[f]==v?null:v);render();return}
  if(a==='wu'||a==='wurm'||a==='wuadd'){
    const k=b.dataset.lift,i=+b.dataset.i,W=wuList(k).map(x=>x?Object.assign({},x):{});
    if(a==='wuadd') W.push({});
    else if(a==='wurm') W.splice(i,1);
    else {
      const x=W[i]||(W[i]={}); x.done=!x.done;
      // logging a set as suggested stores the suggested numbers, so history shows real weights
      if(x.done){const ins=b.parentNode.querySelectorAll('input');if(x.w==null||x.w==='')x.w=ins[0].placeholder!==u()&&ins[0].placeholder!==''?+ins[0].placeholder:null;if(x.r==null||x.r==='')x.r=ins[1].placeholder!=='reps'?+ins[1].placeholder:null}
    }
    for(let j=0;j<W.length;j++) if(!W[j]) W[j]={};
    openWarm.add(k); setLog(sel,'lifts.'+k+'.warmup',W); render(); return}
  if(a==='set'){const k=b.dataset.lift,i=+b.dataset.i;const L=lg(sel);const arr=((L.lifts||{})[k]||{}).sets?[...L.lifts[k].sets]:[];arr[i]=!arr[i];for(let j=0;j<arr.length;j++)if(arr[j]==null)arr[j]=false;setLog(sel,'lifts.'+k+'.sets',arr);
    if(arr[i]&&sel===todayStr()){unlockAudio();const nx=nextAfterSet(k,arr);if(nx!==undefined)startRest(k,nx);else stopRest()}
    render();return}
  if(a==='mod'){setLog(sel,'hic.mod',b.dataset.v);render();return}
  if(a==='l3swap'){const v=b.dataset.v;setLog(sel,'l3',v===l3Auto(sel)?null:v);openWarm.clear();render();return}
  if(a==='restmin'){const k=b.dataset.lift,m=+b.dataset.v;mutatePlan(p=>{p.rest=Object.assign({},p.rest,{[k]:m})});
    if(rest&&rest.k===k&&!rest.done){const el=Date.now()-(rest.end-rest.dur*1000);rest.dur=m*60;rest.end=Date.now()-el+rest.dur*1000;LS.set('ob.rest',rest);tickRest()}
    return}
  if(a==='done'){setLog(sel,'done',!lg(sel).done);render();return}
  if(a==='lower'){const k=b.dataset.lift,c=b.dataset.c;const m=maxFor(+c)[k];if(!m)return;mutatePlan(p=>{p.cycleMaxes[c]=p.cycleMaxes[c]||{};p.cycleMaxes[c][k]=floorTo(m.v*.95,p.round[k])});return}
  if(a==='insert'){mutatePlan(p=>{p.inserts[b.dataset.monday]=b.dataset.kind});return}
  if(a==='uninsert'){mutatePlan(p=>{delete p.inserts[b.dataset.monday]});return}
  if(a==='skip'){mutatePlan(p=>{p.skips[b.dataset.rule]=true});return}
  if(a==='unskip'){mutatePlan(p=>{delete p.skips[b.dataset.rule]});return}
  if(a==='more'){planShow+=26;render();return}
  if(a==='applytest'){const wk=weekOf(b.dataset.monday),res=weekResults(wk,'test'),nc=wk.nextCycle;if(!nc)return;mutatePlan(p=>{p.cycleMaxes[nc]=Object.assign({},p.cycleMaxes[nc]||{},res)});return}
  if(a==='savemaxes'){const wk=weekOf(b.dataset.monday),res=weekResults(wk,'test');mutatePlan(p=>{Object.assign(p.maxes,res)});return}
  if(a==='calc5'){mutatePlan(p=>{for(const k of LK) if(calc5[k]) p.maxes[k]=floorTo(calc5[k]/.87,p.round[k])});calc5={};return}
});

loadLocal();
render();
if(rest) showRest();
connect();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
