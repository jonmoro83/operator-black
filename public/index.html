<title>Operator + Black</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

</head>
<body>
<header>
  <div class="hd">
    <div class="brand"><h1>Operator <span>+</span> Black</h1><div id="status">Connecting…</div></div>
    <div id="upd" class="upd" hidden><span>A new version of the app is ready.</span><span class="upd-b"><button class="btn sm" id="upd-what">What’s new</button><button class="btn sm primary" id="upd-go">Reload</button></span></div>
    <nav id="nav" aria-label="Sections">
      <button data-view="today">Today</button>
      <button data-view="status">Status</button>
      <button data-view="plan">Plan</button>
      <button data-view="history">History</button>
      <button data-view="setup">Setup</button>
      <button data-view="guide">Guide</button>
    </nav>
  </div>
</header>
<div class="wrap"><main id="main"></main></div>
<div id="tip" role="status" hidden></div>
<div id="gd" hidden aria-live="polite"><div class="gd-in" id="gd-in"></div></div>
<div id="ls" hidden aria-live="polite"><div class="ls-in" id="ls-in"></div></div>
<div id="iv" hidden aria-live="polite">
  <div class="iv-in">
    <div class="iv-top"><span id="iv-title"></span><button class="btn sm ghost" id="iv-size" aria-label="Minimize timer">Minimize</button></div>
    <div id="iv-phase">HARD</div>
    <div id="iv-time">0:00</div>
    <div id="iv-sub"></div>
    <div class="iv-bar"><i id="iv-fill"></i></div>
    <div id="iv-next"></div>
    <div id="iv-done" hidden></div>
    <div class="iv-btns" id="iv-btns">
      <button class="btn" data-iv="pause" id="iv-pause">Pause</button>
      <button class="btn" data-iv="skip">Skip</button>
      <button class="btn" data-iv="stop" id="iv-stop">End</button>
    </div>
  </div>
</div>
<div id="toast" hidden role="status"><span id="toast-msg"></span><button class="btn sm" id="toast-undo">Undo</button></div>
<div id="rest" hidden aria-live="polite">
  <div class="rest-in">
    <div class="rest-txt"><span id="rest-lbl"></span><span id="rest-next"></span></div>
    <div id="rest-time" class="rest-time">0:00</div>
    <div class="rest-btns">
      <button class="btn sm" data-rest="-30" aria-label="30 seconds less">−30s</button>
      <button class="btn sm" data-rest="30" aria-label="30 seconds more">+30s</button>
      <button class="btn sm primary" data-rest="stop" id="rest-stop">Skip</button>
    </div>
  </div>
  <div class="rest-bar"><i id="rest-fill"></i></div>
</div>

<script src="/releases.js?b=18590b56b9"></script>
<script src="/app.js?b=18590b56b9"></script>
</body>
