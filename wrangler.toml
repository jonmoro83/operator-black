name = "operator-black"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Only reachable at operatorblack.com, which sits behind Cloudflare Access.
# No *.workers.dev or preview URLs, so there's no way around the login screen.
workers_dev = false
preview_urls = false
routes = [
  { pattern = "operatorblack.com", custom_domain = true },
  { pattern = "www.operatorblack.com", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
# Every request passes through the Worker so www can redirect before any file is served.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "operator-black"
database_id = "3dd5211d-2fd9-43ea-ae95-cc4c4bc7e28f"
migrations_dir = "migrations"

# Weekly backups: a full JSON copy of plan + logs, kept for 26 weeks.
[[kv_namespaces]]
binding = "BACKUPS"
id = "999b995f858d491698b2218e3c18e29d"

[triggers]
crons = ["0 9 * * SUN"]  # Sundays 09:00 UTC

# Rest alerts: a Durable Object per user holds push subscriptions and the pending alarm.
[[durable_objects.bindings]]
name = "ALERTS"
class_name = "RestAlerts"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RestAlerts"]

[vars]
# From Zero Trust → Settings (team domain) and the Access application's
# Overview tab (Application Audience tag). Both are public identifiers, not secrets.
ACCESS_TEAM_DOMAIN = "jon-morozowski.cloudflareaccess.com"
ACCESS_AUD = "75eca489f609e8c2c9a376b294cf4db656d4f1c2c0f33ef6eb5e4503951636e7"
# VAPID "sub" claim for push. The private key is the VAPID_JWK secret.
VAPID_SUBJECT = "https://operatorblack.com"
# Optional extra lock (comma-separated emails allowed through, checked after Access):
# set it as a secret so your email stays out of the repo —
#   npx wrangler secret put ALLOWED_EMAILS
