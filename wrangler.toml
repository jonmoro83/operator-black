name = "operator-black"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "operator-black"
database_id = "3dd5211d-2fd9-43ea-ae95-cc4c4bc7e28f"
migrations_dir = "migrations"

[vars]
# From Zero Trust → Settings → Custom Pages (team domain) and the Access application's
# Overview tab (Application Audience tag). Both are public identifiers, not secrets.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
# Optional extra lock (comma-separated emails allowed through, checked after Access):
# set it as a secret so your email stays out of the repo —
#   npx wrangler pages secret put ALLOWED_EMAILS --project-name operator-black
